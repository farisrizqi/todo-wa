name = "todo-wa-bridge"
main = "worker.js"
compatibility_date = "2024-01-01"

# Reminder sweep runs inside Cloudflare every minute (free plan).
# No external cron-job.org needed.
[triggers]
crons = ["* * * * *"]

# Set secrets via dashboard (Settings > Variables and Secrets).
# Never commit real keys in this file. Recipients come per-todo, no fixed target here.
[vars]
REMINDER_OFFSET_MIN = "3"
# SUPABASE_URL = "https://xyz.supabase.co"
# GOWA_URL = "https://gowa-xxx.app.ravenhost.space (fill after GOWA host is live; empty = sending disabled)"
# GOWA_BASIC_AUTH = "base64(user:pass), only if GOWA uses --basic-auth"
# GOWA_DEVICE_ID = "optional, only with multiple linked devices"
